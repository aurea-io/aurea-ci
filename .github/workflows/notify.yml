name: Aurea Notifications

on:
  workflow_call:
    inputs:
      event-type:
        description: Notification event (image or deploy)
        required: true
        type: string
      image:
        description: Published image name
        required: false
        default: ''
        type: string
      version:
        description: Published version
        required: false
        default: ''
        type: string
      environment:
        description: Deployment environment
        required: false
        default: production
        type: string
      deploy-url:
        description: Optional deployed URL
        required: false
        default: ''
        type: string
      source-commit:
        description: Commit that produced the artifact or deployment
        required: false
        default: ''
        type: string
      status:
        description: Result of the operation
        required: false
        default: success
        type: string

permissions:
  contents: read

jobs:
  notify:
    name: Notify ${{ inputs.event-type }}
    runs-on: ubuntu-latest
    if: ${{ inputs.event-type == 'image' || inputs.event-type == 'deploy' }}
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      EVENT_TYPE: ${{ inputs.event-type }}
      IMAGE: ${{ inputs.image }}
      VERSION: ${{ inputs.version }}
      ENVIRONMENT: ${{ inputs.environment }}
      DEPLOY_URL: ${{ inputs.deploy-url }}
      SOURCE_COMMIT: ${{ inputs.source-commit || github.sha }}
      STATUS: ${{ inputs.status }}
    steps:
      - name: Build notification message
        id: message
        shell: bash
        run: |
          set -euo pipefail
          short_commit="${SOURCE_COMMIT:0:7}"
          result_label="✅ exitoso"
          [[ "${STATUS}" != "success" ]] && result_label="❌ fallido"
          if [[ "${EVENT_TYPE}" == "image" ]]; then
            message="Aurea publicación de imagen ${result_label} 🚀\nRepo: ${GITHUB_REPOSITORY}\nImagen: ${IMAGE}\nVersión: ${VERSION}\nCommit: ${short_commit}"
          else
            message="Aurea deploy ${result_label}\nRepo: ${GITHUB_REPOSITORY}\nEntorno: ${ENVIRONMENT}\nCommit: ${short_commit}"
            [[ -n "${DEPLOY_URL}" ]] && message+="\nURL: ${DEPLOY_URL}"
          fi
          {
            echo 'message<<AUREA_MESSAGE'
            echo "${message}"
            echo 'AUREA_MESSAGE'
          } >> "${GITHUB_OUTPUT}"
      - name: Notify Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          IFS='|' read -ra ids <<< "${TELEGRAM_CHAT_ID}"
          for chat_id in "${ids[@]}"; do
            chat_id="$(echo "${chat_id}" | xargs)"
            [[ -z "${chat_id}" ]] && continue
            curl --fail --silent --show-error --request POST \
              --data-urlencode "chat_id=${chat_id}" \
              --data-urlencode "text=${MESSAGE}" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          done
      - name: Notify Discord
        if: ${{ (env.DISCORD_BOT_TOKEN != '' && env.DISCORD_CHANNEL_ID != '') || env.DISCORD_WEBHOOK_URL != '' }}
        env:
          MESSAGE: ${{ steps.message.outputs.message }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg content "${MESSAGE}" '{content: $content}')"
          if [[ -n "${DISCORD_BOT_TOKEN}" && -n "${DISCORD_CHANNEL_ID}" ]]; then
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              --header 'content-type: application/json' \
              --data "${payload}" \
              "https://discord.com/api/v10/channels/${DISCORD_CHANNEL_ID}/messages"
          else
            curl --fail --silent --show-error --request POST \
              --header 'content-type: application/json' \
              --data "${payload}" "${DISCORD_WEBHOOK_URL}"
          fi
