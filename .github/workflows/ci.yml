name: Aurea CI

on:
  workflow_call:
    inputs:
      project-type:
        description: Supported project profile
        type: string
        required: false
        default: node-frontend
      node-version:
        description: Node.js major version
        type: string
        required: false
        default: '22'

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  validate:
    name: Validate ${{ inputs.project-type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout shared CI
        uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate module manifests (shared CI repository)
        if: github.repository == 'aurea-io/aurea-ci'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/validate-manifests.sh
      - name: Validate module manifests (consumer repository)
        if: github.repository != 'aurea-io/aurea-ci'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .aurea-ci/scripts/validate-manifests.sh
      - name: Validate project profile
        env:
          PROJECT_TYPE: ${{ inputs.project-type }}
        run: |
          case "${PROJECT_TYPE}" in
            node-backend|node-frontend|node-pages|docs|shared-ci) ;;
            *) echo "Perfil desconocido: ${PROJECT_TYPE}" >&2; exit 1 ;;
          esac
      - name: Setup Node.js
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Install dependencies
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm ci --ignore-scripts
      - name: Run backend lint
        if: inputs.project-type == 'node-backend'
        run: npm run lint
      - name: Run frontend lint when available
        if: inputs.project-type == 'node-frontend'
        run: npm run lint --if-present
      - name: Run format check when available
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: npm run format:check --if-present
      - name: Run application checks
        if: inputs.project-type == 'node-pages'
        run: npm run check
      - name: Generate Prisma client
        if: inputs.project-type == 'node-backend'
        run: npx --no-install prisma generate
      - name: Run tests
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-pages'
        run: npm test
      - name: Run backend coverage
        if: inputs.project-type == 'node-backend'
        run: npm run test:cov --if-present
      - name: Upload coverage artifact
        if: always() && inputs.project-type == 'node-backend'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.event.repository.name }}-${{ github.sha }}
          path: coverage/
          if-no-files-found: ignore
      - name: Build application
        if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend'
        run: npm run build
      - name: Build Docker image
        if: inputs.project-type == 'node-pages'
        run: docker build --tag "${{ github.event.repository.name }}:test" .
      - name: Test shared release scripts
        if: inputs.project-type == 'shared-ci' || inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
        run: .aurea-ci/scripts/test-release-scripts.sh

  dependency-audit:
    name: Audit dependencies
    if: inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  conventional-commits:
    name: Validate commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: aurea-io/aurea-ci
          ref: main
          path: .aurea-ci
          token: ${{ github.token }}
          persist-credentials: false
      - name: Validate commit messages
        run: .aurea-ci/scripts/validate-commits.sh "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependency Graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.dependency_graph.status // "disabled"' 2>/dev/null || echo disabled)"
          if [[ "${status}" == "enabled" ]]; then
            echo 'supported=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'supported=false' >> "${GITHUB_OUTPUT}"
            echo "Dependency Graph is ${status}; using npm audit as the available fallback."
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Record unsupported Dependency Review
        if: steps.dependency-graph.outputs.supported != 'true'
        run: echo 'Dependency Review skipped because GitHub Dependency Graph is disabled; dependency-audit remains required for Node projects.'

  codeql:
    name: CodeQL
    if: (inputs.project-type == 'node-backend' || inputs.project-type == 'node-frontend' || inputs.project-type == 'node-pages') && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  gitleaks:
    name: Detect secrets
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        run: |
          set -euo pipefail
          version=8.24.2
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan changed commits for secrets
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${GITHUB_SHA}"
          else
            range="HEAD~1..HEAD"
          fi
          gitleaks git --redact --exit-code 1 --log-opts="${range}"

  gate:
    name: PR Gate
    if: always()
    needs: [validate, dependency-audit, conventional-commits, dependency-review, codeql, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - name: Consolidate required checks
        env:
          RESULTS: ${{ needs.validate.result }} ${{ needs.dependency-audit.result }} ${{ needs.conventional-commits.result }} ${{ needs.dependency-review.result }} ${{ needs.codeql.result }} ${{ needs.gitleaks.result }}
        run: |
          set -euo pipefail
          for result in ${RESULTS}; do
            case "${result}" in
              success|skipped) ;;
              *) echo "PR Gate failed because a required check finished as ${result}." >&2; exit 1 ;;
            esac
          done
          echo "PR Gate passed."
